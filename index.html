<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฝึกฝนเทียบเคียง PISA 2025 LDW — Chatbot มั่นคงวัสดุภัณฑ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --concrete:#F1EDE4;
    --concrete-dark:#E4DDCE;
    --ink:#23201B;
    --ink-soft:#5B564C;
    --orange:#E1611B;
    --orange-dark:#B84D12;
    --steel:#2E5266;
    --steel-light:#4B7A93;
    --rebar:#8C8577;
    --good:#3F7A4E;
    --bad:#B0463D;
    --paper:#FFFDF8;
    --line:#D8D0BF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--concrete);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    line-height:1.65;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Kanit',sans-serif;}
  .app{max-width:920px;margin:0 auto;padding:0 18px 60px;}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--ink);
    color:var(--concrete);
    padding:10px 18px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    border-bottom:4px solid var(--orange);
  }
  .topbar .brand{font-family:'Kanit';font-weight:700;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .topbar .who{margin-left:auto;font-size:13px;color:#D8D2C4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .who b{color:#fff;}
  .topbar .who{margin-right:18px;}
  .timer{font-size:13px;color:#D8D2C4;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .timer b{font-family:'Kanit';font-size:18px;color:#fff;background:var(--steel);padding:1px 10px;border-radius:6px;font-variant-numeric:tabular-nums;}
  .timer.warn b{background:var(--orange);}
  .timer.over b{background:var(--bad);}
  .who .tag{background:var(--steel);color:#fff;padding:2px 9px;border-radius:20px;font-size:12px;}
  .progress-rail{display:flex;gap:4px;width:100%;margin-top:8px;}
  .progress-rail .seg{flex:1;height:6px;border-radius:3px;background:#463F33;position:relative;overflow:hidden;}
  .progress-rail .seg.done{background:var(--orange);}
  .progress-rail .seg.current{background:linear-gradient(90deg,var(--orange) 50%,#463F33 50%);}
  .progress-labels{display:flex;justify-content:space-between;font-size:10.5px;color:#B7AF9E;margin-top:4px;letter-spacing:.3px;}

  /* Card */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 26px 22px;
    margin-top:22px;
    box-shadow:0 1px 0 rgba(35,32,27,.04);
  }
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--orange-dark);font-weight:600;margin-bottom:6px;}
  .eyebrow .dot{width:7px;height:7px;background:var(--orange);border-radius:50%;}
  h2.section-title{font-size:23px;margin:0 0 4px;color:var(--ink);}
  .subtitle{color:var(--ink-soft);font-size:14.5px;margin:0 0 16px;}

  /* Buttons */
  .btn{
    font-family:'Kanit';font-weight:600;font-size:15px;
    background:var(--orange);color:#fff;border:none;
    padding:11px 22px;border-radius:6px;cursor:pointer;
    transition:transform .08s ease, background .15s;
  }
  .btn:hover{background:var(--orange-dark);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent;color:var(--steel);border:1.5px solid var(--steel);}
  .btn.secondary:hover{background:var(--steel);color:#fff;}
  .btn:disabled{background:#C9C2B2;cursor:not-allowed;}
  .btn-row{display:flex;justify-content:space-between;margin-top:24px;gap:10px;}

  /* Form */
  label.field-label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink);}
  input[type=text], select, textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:6px;
    font-family:'IBM Plex Sans Thai';font-size:15px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:90px;}
  input[type=text]:focus, select:focus, textarea:focus{outline:2px solid var(--steel-light);border-color:var(--steel-light);}
  .field{margin-bottom:18px;}

  /* MCQ */
  .qtext{font-size:16.5px;font-weight:600;margin:14px 0 12px;color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:9px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    border:1.5px solid var(--line);border-radius:7px;padding:11px 13px;
    cursor:pointer;background:#fff;transition:border-color .1s, background .1s;
  }
  .opt:hover{border-color:var(--steel-light);}
  .opt.selected{border-color:var(--orange);background:#FDF1E9;}
  .opt input{margin-top:3px;}
  .qcounter{font-size:12.5px;color:var(--ink-soft);letter-spacing:.3px;}

  /* Chart wrap */
  .chart-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px 0;}
  .chart-wrap canvas{max-height:260px;}
  .teach-box{background:var(--concrete-dark);border-left:4px solid var(--steel);padding:12px 15px;border-radius:0 6px 6px 0;font-size:14.5px;margin:12px 0;}

  /* Chat bubbles hero */
  .chat-demo{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
  .bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14.5px;position:relative;}
  .bubble.user{align-self:flex-start;background:#fff;border:1.5px solid var(--line);border-bottom-left-radius:3px;}
  .bubble.bot{align-self:flex-end;background:var(--steel);color:#fff;border-bottom-right-radius:3px;}
  .bubble .intent-tag{display:inline-block;margin-top:6px;font-size:11px;background:var(--orange);color:#fff;padding:1px 8px;border-radius:10px;font-family:'Kanit';}

  /* Apply activity */
  .control{margin-bottom:16px;}
  .control-head{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px;}
  .control-head .val{font-family:'Kanit';color:var(--orange-dark);}
  input[type=range]{width:100%;accent-color:var(--orange);}
  table.msg-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.8px;}
  table.msg-table th, table.msg-table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
  table.msg-table th{color:var(--ink-soft);font-weight:600;font-size:12.5px;text-transform:none;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-family:'Kanit';font-weight:600;}
  .pill.BUY{background:#FDE7DA;color:var(--orange-dark);}
  .pill.PRICE{background:#DDEAF0;color:var(--steel);}
  .pill.PRODUCT{background:#E4EEDF;color:var(--good);}
  .pill.CLARIFY{background:#EFEAE0;color:var(--ink-soft);}
  .row-ok{background:#F2F8F3;}
  .row-bad{background:#FBEEEC;}
  .accbar-wrap{margin-top:16px;background:var(--concrete-dark);border-radius:20px;height:14px;overflow:hidden;}
  .accbar-fill{height:100%;background:var(--good);transition:width .25s;}
  .acc-readout{display:flex;justify-content:space-between;margin-top:6px;font-size:13.5px;font-weight:600;}

  /* Likert */
  .likert-row{margin-bottom:20px;}
  .likert-stmt{font-size:15px;font-weight:500;margin-bottom:8px;}
  .likert-scale{display:flex;gap:8px;}
  .likert-opt{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:7px;padding:9px 4px;cursor:pointer;font-size:12.5px;background:#fff;}
  .likert-opt.selected{border-color:var(--steel);background:#EAF1F4;color:var(--steel);font-weight:600;}

  /* Report */
  .score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;}
  .score-box{background:var(--concrete-dark);border-radius:8px;padding:14px 10px;text-align:center;}
  .score-box .n{font-family:'Kanit';font-size:24px;font-weight:700;color:var(--steel);}
  .score-box .l{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .level-banner{padding:18px;border-radius:8px;text-align:center;margin:14px 0;color:#fff;}
  .level-banner .lv{font-family:'Kanit';font-size:26px;font-weight:700;}
  .save-status{font-size:13px;color:var(--ink-soft);margin-top:10px;text-align:center;}
  .hist-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.8px;}
  .hist-table th,.hist-table td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:center;}
  .hist-table th{background:var(--concrete-dark);}

  .stripe{height:8px;background:repeating-linear-gradient(45deg,var(--ink) 0 10px, var(--orange) 10px 20px);border-radius:4px;margin:20px 0;}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px;padding-bottom:10px;}
  .icon{width:20px;height:20px;flex-shrink:0;}
  @media(max-width:600px){
    .score-grid{grid-template-columns:repeat(2,1fr);}
    .bubble{max-width:88%;}
  }

  .phone{width:300px;max-width:100%;margin:22px auto;border:9px solid var(--ink);border-radius:34px;background:#EDE6DA;overflow:hidden;box-shadow:0 8px 24px rgba(35,32,27,.25);position:relative;}
  .phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:16px;background:var(--ink);border-radius:0 0 12px 12px;z-index:2;}
  .phone-status{background:var(--steel);color:#fff;font-size:11px;display:flex;justify-content:space-between;padding:5px 16px 3px;}
  .phone-head{background:var(--steel);color:#fff;display:flex;gap:10px;align-items:center;padding:8px 14px 10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .pname{font-family:'Kanit';font-weight:600;font-size:14px;line-height:1.2;}
  .pstat{font-size:11px;color:#BFE3C5;}
  .phone-body{padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:260px;}
  .msg{max-width:80%;padding:7px 11px;border-radius:14px;font-size:13.5px;line-height:1.45;}
  .msg .t{display:block;font-size:9.5px;opacity:.6;text-align:right;margin-top:2px;}
  .msg.me{align-self:flex-end;background:#DCF3D0;border-bottom-right-radius:3px;}
  .msg.bot{align-self:flex-start;background:#fff;border-bottom-left-radius:3px;}
  .msg .intent-tag{display:inline-block;margin-left:6px;font-size:11px;background:var(--orange);color:#fff;padding:1px 8px;border-radius:10px;font-family:'Kanit';}
  .phone-input{display:flex;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid var(--line);}
  .fake-input{flex:1;background:var(--concrete);border-radius:16px;padding:6px 12px;font-size:12.5px;color:var(--rebar);}
  .send{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}

  /* --- Scratch-like command blocks --- */
  .blocks-hint{font-size:13px;color:var(--ink-soft);background:var(--concrete);border-radius:6px;padding:9px 12px;margin:12px 0;}
  .blocks-layout{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:start;}
  .col-head{font-size:14px;margin:0 0 8px;color:var(--ink-soft);font-weight:600;}
  .palette,.script{background:var(--concrete);border:1px dashed var(--line);border-radius:8px;padding:12px 10px;min-height:120px;}
  .sblock{
    position:relative;cursor:grab;user-select:none;
    color:#fff;font-size:13.2px;line-height:1.4;font-weight:500;
    padding:11px 13px 11px 15px;margin:0 0 14px;border-radius:6px;
    box-shadow:0 2px 0 rgba(0,0,0,.22);
  }
  .sblock:last-child{margin-bottom:4px;}
  .sblock::before{content:'';position:absolute;top:-6px;left:16px;width:20px;height:7px;background:inherit;border-radius:3px 3px 0 0;}
  .sblock::after{content:'';position:absolute;bottom:-7px;left:16px;width:20px;height:7px;background:inherit;border-radius:0 0 4px 4px;box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .sblock.cond{background:#E0A32E;}
  .sblock.act{background:#4C97D6;}
  .sblock.else{background:#CF63CF;}
  .sblock.picked{outline:3px solid var(--ink);outline-offset:2px;}
  .sblock:active{cursor:grabbing;}
  .sblock.in-slot{margin:0;}
  .sblock.in-slot::after{display:none;}
  .slot-row{margin-bottom:12px;}
  .slot-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;}
  .slot{border:2px dashed var(--rebar);border-radius:7px;min-height:46px;padding:5px;background:#FFFDF8;display:flex;align-items:center;}
  .slot.filled{border-style:solid;border-color:transparent;background:transparent;padding:0;}
  .slot.filled .sblock{width:100%;}
  .slot.over{border-color:var(--orange);background:#FDF1E9;}
  .slot.ready:not(.filled){border-color:var(--orange);}
  .slot-empty{font-size:12.5px;color:var(--rebar);padding-left:8px;}
  .empty-note{font-size:12.5px;color:var(--rebar);text-align:center;padding:14px 0;}
  @media(max-width:700px){ .blocks-layout{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="topbar" class="topbar" style="display:none;">
  <div class="brand">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v10H8l-4 4V5z"/></svg>
    Chatbot RiskGuard · มั่นคงวัสดุภัณฑ์
  </div>
  <div class="who" id="whoBox"></div>
  <div class="timer" id="timerBox">เหลือเวลา <b id="timerVal">30:00</b></div>
  <div style="width:100%;">
    <div class="progress-rail" id="progressRail"></div>
    <div class="progress-labels"><span>SHOW</span><span>LEARN</span><span>APPLY</span><span>REFLECT</span><span>REPORT</span></div>
  </div>
</div>

<div class="app">
  <div id="screen"></div>
  <footer>แบบฝึกฝนเทียบเคียงกรอบการประเมิน PISA 2025 — Learning in the Digital World (LDW) · สถานการณ์จำลอง ไม่ใช่เครื่องมือให้บริการจริง</footer>
</div>

<script>
/* ============================= DATA ============================= */

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwj6yK7LCtTc_90VHpl2GndYSnYGgUA-B94dksZIxwk_Q9ZVcNx8cnEL2yJ8k3QvBjs/exec";
const GRADE_OPTIONS = ["ชั้นมัธยมศึกษาปีที่ 2","ชั้นมัธยมศึกษาปีที่ 3","ชั้นมัธยมศึกษาปีที่ 4","ปวช."];

const state = {
  screen:"intro",
  name:"",
  grade:"",
  showIdx:0, showAnswers:[null,null,null,null,null],
  learnIdx:0, learnAnswers:[null,null,null,null,null,null,null],
  applyIdx:0, applyResults:[null,null,null,null,null], // locked accuracy per activity (0-1)
  applyState:{}, // live control values per activity
  reflectLikert:[null,null,null,null],
  reflectOpen:["",""],
  saving:false, saveMsg:"", history:[]
};

const SHOW_Q = [
 { q:"Chatbot ในบริบทของร้านค้าออนไลน์ทำหน้าที่อะไรเป็นหลัก?",
   opts:["เก็บภาษีสินค้าให้ร้านค้าโดยอัตโนมัติ","โต้ตอบกับลูกค้าด้วยข้อความแทนพนักงานได้ตลอดเวลา","จัดส่งสินค้าให้ลูกค้าโดยไม่ต้องใช้พนักงานขนส่ง","คำนวณภาษีนำเข้าสินค้าวัสดุก่อสร้าง"], correct:1},
 { q:"คำว่า “Intent” ในระบบแชทบอท หมายถึงสิ่งใด?",
   opts:["รหัสสินค้าที่ลูกค้าต้องการซื้อ","ความตั้งใจหรือเป้าหมายที่แท้จริงของข้อความที่ผู้ใช้พิมพ์เข้ามา","จำนวนตัวอักษรในข้อความของลูกค้า","ชื่อผู้ดูแลระบบแชทบอท"], correct:1},
 { q:"เพราะเหตุใดระบบจึงควรคำนวณ “คะแนน” รวมของคำบ่งชี้ทั้งประโยค แทนที่จะตัดสินจากคำแรกที่พบเพียงคำเดียว?",
   opts:["เพื่อให้ประมวลผลเร็วขึ้นโดยไม่ต้องอ่านทั้งประโยค","เพราะคำแรกในประโยคภาษาไทยมักไม่มีความหมาย","เพื่อพิจารณาน้ำหนักของคำบ่งชี้ทุกคำร่วมกัน ลดโอกาสตัดสินใจผิดจากคำเดียว","เพื่อลดจำนวนคำที่ต้องเก็บในฐานข้อมูล"], correct:2},
 { q:"จากกราฟแสดงจำนวนข้อความที่ลูกค้าถามในแต่ละหมวด (ซื้อ 40, ถามราคา 55, ถามรายการสินค้า 25) หมวดใดที่ลูกค้าถามมากที่สุด?",
   opts:["ถามซื้อสินค้า","ถามราคาสินค้า","ถามรายการสินค้า","มากเท่ากันทุกหมวด"], correct:1, chart:{labels:["ซื้อสินค้า","ถามราคา","ถามรายการสินค้า"],data:[40,55,25]}},
 { q:"เหตุใดข้อความภาษาถิ่นหรือคำสะกดผิด เช่น “มีปูนก่อขายบ่” จึงเป็นความท้าทายของแชทบอท?",
   opts:["เพราะลูกค้าพิมพ์เร็วเกินไปจนระบบประมวลผลไม่ทัน","เพราะคำเหล่านี้ไม่ตรงกับรูปแบบมาตรฐานที่ระบบถูกฝึกให้จดจำ จึงอาจตรวจไม่พบคำบ่งชี้","เพราะภาษาถิ่นมีตัวอักษรมากกว่าภาษามาตรฐาน","เพราะระบบไม่อนุญาตให้พิมพ์ภาษาถิ่น"], correct:1},
];

const LEARN_TASKS = [
 { title:"ภาระงานที่ 1 · น้ำหนักคะแนนของคำบ่งชี้ Intent",
   teach:"ระบบให้คะแนนคำหรือคุณลักษณะที่ตรวจพบในข้อความ 5 ประเภท: คำที่แสดงความต้องการซื้อ (+3), คำเกี่ยวกับราคา (+3), คำเกี่ยวกับรายการสินค้า (+3), คำระบุสินค้า เช่น ปูน/เหล็ก/อิฐ (+1), และจำนวนสินค้าที่ต้องการ เช่น “5 ถุง” (+2) — สังเกตว่าคำระบุสินค้าเพียงคำเดียวมีน้ำหนักน้อยที่สุด เพราะบอกได้แค่ว่ากำลังพูดถึงสินค้าอะไร แต่ยังไม่บอกว่าลูกค้าต้องการอะไรกับสินค้านั้น",

function decide(scores, margin){
  const entries = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const top = entries[0][1], second = entries[1][1];
  return (top - second) > margin ? entries[0][0] : "CLARIFY";
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let chartInstances = [];
function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances=[]; }

function renderChart(canvas, cfg){
  if(cfg.type==='bar'){
    const c = new Chart(canvas, {type:'bar', data:{labels:cfg.labels, datasets:[{label:'คะแนนน้ำหนัก/จำนวน', data:cfg.data, backgroundColor:cfg.color}]},
      options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}});
    chartInstances.push(c);
  } else if(cfg.type==='line'){
    const c = new Chart(canvas, {type:'line', data:{labels:cfg.labels, datasets:[{label:'BUY Score สะสม', data:cfg.data, borderColor:cfg.color, backgroundColor:cfg.color, tension:.25, fill:false, pointRadius:5}]},
      options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, suggestedMax:8}}}});
    chartInstances.push(c);
  } else if(cfg.type==='grouped'){
    const c = new Chart(canvas, {type:'bar', data:{labels:cfg.labels, datasets:cfg.series.map(s=>({label:s.name, data:s.data, backgroundColor:s.color}))},
      options:{scales:{y:{beginAtZero:true}}}});
    chartInstances.push(c);
  }
}

/* ============================= SCORING ============================= */
function computeShowScore(){
  let c=0; SHOW_Q.forEach((q,i)=>{ if(state.showAnswers[i]===q.correct) c++; });
  return c/SHOW_Q.length*100;
}
function learnTaskScore(t, ans){
  // returns 0..1 for one task
  if(t.type==='blocks'){
    if(!Array.isArray(ans)) return 0;
    let ok=0;
    t.slots.forEach((s,i)=>{ if(ans[i]===s.ans) ok++; });
    return ok/t.slots.length;
  }
  return ans===t.correct ? 1 : 0;
}
function learnTaskWeight(t){ return t.type==='blocks' ? 2 : 1; }
function computeLearnScore(){
  let got=0, total=0;
  LEARN_TASKS.forEach((t,i)=>{
    const w = learnTaskWeight(t);
    total += w;
    got += w * learnTaskScore(t, state.learnAnswers[i]);
  });
  return total? got/total*100 : 0;
}
function computeApplyScore(){
  const vals = state.applyResults.filter(v=>v!==null);
  if(vals.length===0) return 0;
  const sum = vals.reduce((a,b)=>a+b,0);
  return sum/state.applyResults.length*100;
}
function computeReflectScore(){
  let pts=0;
  state.reflectLikert.forEach(v=>{ if(v!==null) pts+=12.5; });
  state.reflectOpen.forEach(v=>{ if(v && v.trim().length>=15) pts+=25; });
  return pts;
}
function computeOverall(show,learn,apply,reflect){
  return show*0.10 + learn*0.40 + apply*0.35 + reflect*0.15;
}
function qualityLevel(overall){
  if(overall>=85) return {n:4,label:"ระดับ 4 — Advanced (เชี่ยวชาญ)", color:"#3F7A4E"};
  if(overall>=70) return {n:3,label:"ระดับ 3 — Proficient (ชำนาญ)", color:"#2E5266"};
  if(overall>=50) return {n:2,label:"ระดับ 2 — Basic (พื้นฐาน)", color:"#B8862D"};
  return {n:1,label:"ระดับ 1 — Needs Improvement (ต้องพัฒนา)", color:"#B0463D"};
}

function renderLearnBlocks(i, t){
  if(!Array.isArray(state.learnAnswers[i])) state.learnAnswers[i] = new Array(t.slots.length).fill(null);
  const placed = state.learnAnswers[i];
  let picked = null; // id selected by click (tap fallback)

  const wrap = el(`<div class="card">
    <div class="eyebrow"><span class="dot"></span>ขั้นตอนที่ 2 · LEARN — เรียนรู้</div>
    <h2 class="section-title">${t.title}</h2>
    <div class="qcounter">ข้อที่ ${i+1} / ${LEARN_TASKS.length}</div>
    <div class="teach-box">${t.teach}</div>
    <div class="blocks-hint">ลากบล็อกจาก “กล่องบล็อกคำสั่ง” ไปวางในช่องของ “พื้นที่ประกอบคำสั่ง” — บนมือถือใช้วิธีแตะบล็อกหนึ่งครั้ง แล้วแตะช่องที่ต้องการวาง · แตะบล็อกที่วางแล้วเพื่อนำออก</div>
    <div class="blocks-layout">
      <div class="palette-col">
        <h3 class="col-head">กล่องบล็อกคำสั่ง</h3>
        <div class="palette" id="palette"></div>
      </div>
      <div class="script-col">
        <h3 class="col-head">พื้นที่ประกอบคำสั่ง</h3>
        <div class="script" id="script"></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="backBtn">ย้อนกลับ</button>
      <button class="btn" id="nextBtn">${i===LEARN_TASKS.length-1 ? "ไปขั้นตอน APPLY" : "ภาระงานถัดไป"}</button>
    </div>
  </div>`);
  $('#screen').appendChild(wrap);

  const paletteEl = wrap.querySelector('#palette');
  const scriptEl = wrap.querySelector('#script');

  function blockHtml(b, extraClass){
    return `<div class="sblock ${b.kind} ${extraClass||''}" draggable="true" data-id="${b.id}">${b.text}</div>`;
  }
  function byId(id){ return t.blocks.find(b=>b.id===id); }

  // Shuffle the palette once per task so the listed order never reveals the answer.
  if(!t._order){
    const arr = t.blocks.map(b=>b.id);
    let seed = t.slots.length*7919 + t.blocks.length*104729;
    for(let k=arr.length-1;k>0;k--){
      seed = (seed*1103515245 + 12345) & 0x7fffffff;
      const j = seed % (k+1);
      [arr[k],arr[j]] = [arr[j],arr[k]];
    }
    t._order = arr;
  }
  const orderedBlocks = t._order.map(id=>t.blocks.find(b=>b.id===id));

  function draw(){
    // palette = blocks not yet placed
    paletteEl.innerHTML = orderedBlocks
      .filter(b=>!placed.includes(b.id))
      .map(b=>blockHtml(b)).join('') || '<div class="empty-note">วางบล็อกครบแล้ว</div>';

    scriptEl.innerHTML = t.slots.map((s,si)=>{
      const id = placed[si];
      const inner = id ? blockHtml(byId(id),'in-slot') : '<div class="slot-empty">วางบล็อกที่นี่</div>';
      return `<div class="slot-row">
        <div class="slot-label">${s.label}</div>
        <div class="slot ${id?'filled':''} ${picked?'ready':''}" data-slot="${si}">${inner}</div>
      </div>`;
    }).join('');

    bind();
    const nb = wrap.querySelector('#nextBtn');
    nb.disabled = placed.some(x=>x===null);
  }

  function place(slotIdx, blockId){
    const prev = placed.indexOf(blockId);
    if(prev !== -1) placed[prev] = null;      // move within script
    placed[slotIdx] = blockId;
    picked = null;
    draw();
  }

  function bind(){
    paletteEl.querySelectorAll('.sblock').forEach(b=>{
      b.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', b.dataset.id); });
      b.onclick = ()=>{
        picked = (picked===b.dataset.id) ? null : b.dataset.id;
        paletteEl.querySelectorAll('.sblock').forEach(x=>x.classList.toggle('picked', x.dataset.id===picked));
        scriptEl.querySelectorAll('.slot').forEach(x=>x.classList.toggle('ready', !!picked));
      };
    });
    scriptEl.querySelectorAll('.sblock').forEach(b=>{
      b.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', b.dataset.id); });
      b.onclick = (e)=>{
        e.stopPropagation();
        const si = placed.indexOf(b.dataset.id);
        if(si!==-1){ placed[si]=null; picked=null; draw(); }
      };
    });
    scriptEl.querySelectorAll('.slot').forEach(sl=>{
      sl.addEventListener('dragover', e=>{ e.preventDefault(); sl.classList.add('over'); });
      sl.addEventListener('dragleave', ()=> sl.classList.remove('over'));
      sl.addEventListener('drop', e=>{
        e.preventDefault(); sl.classList.remove('over');
        const id = e.dataTransfer.getData('text/plain');
        if(id) place(parseInt(sl.dataset.slot), id);
      });
      sl.onclick = ()=>{ if(picked) place(parseInt(sl.dataset.slot), picked); };
    });
  }

  draw();
  wrap.querySelector('#backBtn').onclick = ()=>{
    if(i>0){ state.learnIdx--; } else { state.screen='show'; state.showIdx=SHOW_Q.length-1; }
    render();
  };
  wrap.querySelector('#nextBtn').onclick = ()=>{
    if(placed.some(x=>x===null)) return;
    if(i<LEARN_TASKS.length-1){ state.learnIdx++; } else { state.screen='apply'; state.applyIdx=0; }
    render();
  };
}

function getApplyCtrlState(actIdx){
  const act = APPLY_ACTIVITIES[actIdx];
  if(!state.applyState[act.id]) state.applyState[act.id] = Object.assign({}, act.defaults);
  return state.applyState[act.id];
}

function renderApply(){
  const idx = state.applyIdx, act = APPLY_ACTIVITIES[idx];
  const ctrl = getApplyCtrlState(idx);

  const wrap = el(`<div class="card">
    <div class="eyebrow"><span class="dot"></span>ขั้นตอนที่ 3 · APPLY — ประยุกต์ใช้</div>
    <h2 class="section-title">${act.title}</h2>
    <div class="qcounter">กิจกรรมที่ ${idx+1} / ${APPLY_ACTIVITIES.length}</div>
    <p class="subtitle">${act.desc}</p>
    <div id="controlsBox"></div>
    <table class="msg-table">
      <thead><tr><th>ข้อความลูกค้า</th><th>คะแนนที่คำนวณได้</th><th>Intent ที่ถูกต้อง</th><th>ระบบทำนาย</th><th></th></tr></thead>
      <tbody id="rowsBody"></tbody>
    </table>
    <div class="accbar-wrap"><div class="accbar-fill" id="accFill"></div></div>
    <div class="acc-readout"><span>ความแม่นยำปัจจุบัน</span><span id="accText"></span></div>
    <div class="btn-row">
      <button class="btn secondary" id="backBtn">ย้อนกลับ</button>
      <button class="btn" id="nextBtn">${idx===APPLY_ACTIVITIES.length-1 ? "ยืนยันและไปขั้นตอน REFLECT" : "ยืนยันและไปกิจกรรมถัดไป"}</button>
    </div>
  </div>`);
  $('#screen').appendChild(wrap);

  let acc = 0;
  function update(){
    let correctCount = 0;
    const rows = act.msgs.map(m=>{
      const scores = act.scoreFn(m, ctrl);
      const margin = ctrl.margin!==undefined ? ctrl.margin : 0;
      const pred = decide(scores, margin);
      const ok = pred === m.true;
      if(ok) correctCount++;
      const scoreStr = Object.entries(scores).map(([k,v])=>`${k}:${v}`).join(' / ');
      return `<tr class="${ok?'row-ok':'row-bad'}">
        <td>${escapeHtml(m.text)}</td>
        <td style="font-size:12px;color:var(--ink-soft);">${scoreStr}</td>
        <td><span class="pill ${m.true}">${m.true}</span></td>
        <td><span class="pill ${pred}">${pred}</span></td>
        <td>${ok?'✅':'❌'}</td></tr>`;
    }).join('');
    acc = correctCount / act.msgs.length;
    wrap.querySelector('#rowsBody').innerHTML = rows;
    const f = wrap.querySelector('#accFill');
    f.style.width = (acc*100).toFixed(0)+'%';
    f.style.background = acc===1 ? 'var(--good)' : (acc>=0.7 ? '#B8862D' : 'var(--bad)');
    wrap.querySelector('#accText').textContent = `${correctCount} / ${act.msgs.length} (${(acc*100).toFixed(1)}%)`;
  }

  const cbox = wrap.querySelector('#controlsBox');
  act.controls.forEach(c=>{
    const row = el(`<div class="control">
      <div class="control-head"><span>${c.l}</span><span class="val">${ctrl[c.k]}</span></div>
      <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${ctrl[c.k]}">
    </div>`);
    cbox.appendChild(row);
    const input = row.querySelector('input'), val = row.querySelector('.val');
    const handler = (e)=>{
      ctrl[c.k] = parseFloat(e.target.value);
      val.textContent = ctrl[c.k];
      update();
    };
    input.addEventListener('input', handler);
    input.addEventListener('change', handler);
  });
  update();

  wrap.querySelector('#backBtn').onclick = ()=>{
    if(idx>0){ state.applyIdx--; } else { state.screen='learn'; state.learnIdx=LEARN_TASKS.length-1; }
    render();
  };
  wrap.querySelector('#nextBtn').onclick = ()=>{
    state.applyResults[idx] = acc;
    if(idx<APPLY_ACTIVITIES.length-1){ state.applyIdx++; } else { state.screen='reflect'; }
    render();
  };
}

function renderReflect(){
  const wrap = el(`<div class="card">
    <div class="eyebrow"><span class="dot"></span>ขั้นตอนที่ 4 · REFLECT — ประเมินตนเอง</div>
    <h2 class="section-title">สะท้อนคิดเกี่ยวกับการออกแบบระบบ Intent</h2>
    <p class="subtitle">ให้คะแนนความเห็นด้วยกับข้อความต่อไปนี้ และตอบคำถามปลายเปิดด้วยความคิดเห็นของตนเอง</p>
    <div id="likertBox"></div>
    <div class="stripe"></div>
    <div id="openBox"></div>
    <div class="btn-row">
      <button class="btn secondary" id="backBtn">ย้อนกลับ</button>
      <button class="btn" id="submitBtn">ส่งคำตอบและดูรายงานผล</button>
    </div>
  </div>`);
  $('#screen').appendChild(wrap);

  const lb = wrap.querySelector('#likertBox');
  REFLECT_LIKERT.forEach((stmt,i)=>{
    const row = el(`<div class="likert-row">
      <div class="likert-stmt">${i+1}. ${stmt}</div>
      <div class="likert-scale">
        ${LIKERT_LABELS.map((lab,v)=>`<div class="likert-opt ${state.reflectLikert[i]===v?'selected':''}" data-i="${i}" data-v="${v}">${lab}</div>`).join('')}
      </div>
    </div>`);
    lb.appendChild(row);
  });
  lb.querySelectorAll('.likert-opt').forEach(o=>{
    o.onclick = ()=>{ state.reflectLikert[parseInt(o.dataset.i)] = parseInt(o.dataset.v); render(); };
  });

  const ob = wrap.querySelector('#openBox');
  REFLECT_OPEN.forEach((q,i)=>{
    const row = el(`<div class="field">
      <label class="field-label">${i+5}. ${q}</label>
      <textarea data-i="${i}" placeholder="พิมพ์คำตอบของนักเรียน...">${escapeHtml(state.reflectOpen[i])}</textarea>
    </div>`);
    ob.appendChild(row);
  });
  ob.querySelectorAll('textarea').forEach(t=>{
    t.oninput = (e)=>{ state.reflectOpen[parseInt(t.dataset.i)] = e.target.value; };
  });

  wrap.querySelector('#backBtn').onclick = ()=>{ state.screen='apply'; state.applyIdx=APPLY_ACTIVITIES.length-1; render(); };
  wrap.querySelector('#submitBtn').onclick = ()=>{
    const allLikert = state.reflectLikert.every(v=>v!==null);
    if(!allLikert){ alert('กรุณาตอบข้อความให้ครบทุกข้อก่อนส่งคำตอบ'); return; }
    state.screen='report'; stopTimer(); render(); saveResult();
  };
}

function renderReport(){
  const show = computeShowScore(), learn = computeLearnScore(), apply = computeApplyScore(), reflect = computeReflectScore();
  const overall = computeOverall(show,learn,apply,reflect);
  const lvl = qualityLevel(overall);

  const wrap = el(`<div class="card">
    <div class="eyebrow"><span class="dot"></span>ขั้นตอนที่ 5 · รายงานผล</div>
    <h2 class="section-title">สรุปผลการทำแบบทดสอบ</h2>
    <p class="subtitle">${escapeHtml(state.name)} · ${escapeHtml(state.grade)}</p>
    <div class="score-grid">
      <div class="score-box"><div class="n">${show.toFixed(0)}</div><div class="l">SHOW (10%)</div></div>
      <div class="score-box"><div class="n">${learn.toFixed(0)}</div><div class="l">LEARN (40%)</div></div>
      <div class="score-box"><div class="n">${apply.toFixed(0)}</div><div class="l">APPLY (35%)</div></div>
      <div class="score-box"><div class="n">${reflect.toFixed(0)}</div><div class="l">REFLECT (15%)</div></div>
    </div>
    <div class="chart-wrap"><canvas id="reportChart"></canvas></div>
    <div class="level-banner" style="background:${lvl.color}">
      <div>คะแนนรวม ${overall.toFixed(1)} / 100</div>
      <div class="lv">${lvl.label}</div>
    </div>
    <div class="save-status" id="saveStatus">${state.saveMsg}</div>
    <div id="historyBox"></div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn secondary" id="restartBtn">เริ่มทำแบบทดสอบใหม่</button>
    </div>
  </div>`);
  $('#screen').appendChild(wrap);
  renderChart(wrap.querySelector('#reportChart'), {type:'bar', labels:['SHOW','LEARN','APPLY','REFLECT'], data:[show,learn,apply,reflect], color:'#E1611B'});
  wrap.querySelector('#restartBtn').onclick = ()=>{
    Object.assign(state, {screen:'intro', name:'', grade:'', showIdx:0, showAnswers:[null,null,null,null,null],
      learnIdx:0, learnAnswers:[null,null,null,null,null,null,null], applyIdx:0, applyResults:[null,null,null,null,null],
      applyState:{}, reflectLikert:[null,null,null,null], reflectOpen:['',''], saving:false, saveMsg:'', history:[]});
    resetTimer(); render();
  };
  renderHistory(wrap.querySelector('#historyBox'));
}

/* ============================= SAVE / HISTORY ============================= */
async function saveResult(){
  const show = computeShowScore(), learn = computeLearnScore(), apply = computeApplyScore(), reflect = computeReflectScore();
  const overall = computeOverall(show,learn,apply,reflect);
  const lvl = qualityLevel(overall);
  const payload = {
    action:'save',
    timestamp: new Date().toISOString(),
    name: state.name,
    grade: state.grade,
    showScore: show.toFixed(1),
    learnScore: learn.toFixed(1),
    applyScore: apply.toFixed(1),
    reflectScore: reflect.toFixed(1),
    overallScore: overall.toFixed(1),
    quality: lvl.label
  };
  state.saveMsg = 'กำลังบันทึกผล...';
  const statusEl = document.getElementById('saveStatus');
  if(statusEl) statusEl.textContent = state.saveMsg;
  try{
    await fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    state.saveMsg = 'บันทึกผลเรียบร้อยแล้ว';
  }catch(e){
    state.saveMsg = 'บันทึกผลไม่สำเร็จ (ตรวจสอบการเชื่อมต่อ) — ผลของนักเรียนยังแสดงอยู่ด้านบน';
  }
  const s2 = document.getElementById('saveStatus');
  if(s2) s2.textContent = state.saveMsg;
  loadHistory();
}

async function loadHistory(){
  try{
    const res = await fetch(`${WEBAPP_URL}?action=history&name=${encodeURIComponent(state.name)}`);
    const data = await res.json();
    state.history = Array.isArray(data) ? data : (data.rows || []);
  }catch(e){ state.history = []; }
  const box = document.getElementById('historyBox');
  if(box) renderHistory(box);
}

function renderHistory(box){
  if(!box) return;
  if(!state.history || state.history.length===0){ box.innerHTML=''; return; }
  box.innerHTML = `<h3 style="font-size:15px;margin-top:22px;">ประวัติการทำแบบทดสอบของ ${escapeHtml(state.name)}</h3>
  <table class="hist-table">
    <thead><tr><th>วันเวลา</th><th>SHOW</th><th>LEARN</th><th>APPLY</th><th>REFLECT</th><th>รวม</th><th>ระดับ</th></tr></thead>
    <tbody>
      ${state.history.map(r=>`<tr>
        <td>${escapeHtml(r.timestamp||'')}</td><td>${escapeHtml(r.showScore||'')}</td><td>${escapeHtml(r.learnScore||'')}</td>
        <td>${escapeHtml(r.applyScore||'')}</td><td>${escapeHtml(r.reflectScore||'')}</td><td>${escapeHtml(r.overallScore||'')}</td><td>${escapeHtml(r.quality||'')}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

/* ============================= TIMER ============================= */
const EXAM_SECONDS = 30*60;
let timerStart = null, timerHandle = null;
function fmtTime(s){ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function tickTimer(){
  if(!timerStart) return;
  const left = EXAM_SECONDS - Math.floor((Date.now()-timerStart)/1000);
  const v = document.getElementById('timerVal'), box = document.getElementById('timerBox');
  if(v) v.textContent = fmtTime(left);
  if(box){ box.classList.toggle('warn', left<=300 && left>60); box.classList.toggle('over', left<=60); }
}
function startTimer(){
  stopTimer(); timerStart = Date.now(); tickTimer();
  timerHandle = setInterval(tickTimer, 1000);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function resetTimer(){ stopTimer(); timerStart=null; const v=document.getElementById('timerVal'); if(v) v.textContent=fmtTime(EXAM_SECONDS); const b=document.getElementById('timerBox'); if(b) b.className='timer'; }

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
